[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sixfingers"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.15.0",
  "torchvision==0.29.2",
  "open_clip_torch==4.2.2",
  "transformers==5.23.0",
  "timm==1.0.31",
  "diffusers==0.43.0",
  "accelerate==1.15.0",
  "safetensors==0.8.0",
  "huggingface_hub==2.4.0",
  "datasets==5.2.0",
  "scikit-learn==1.9.1",
  "numpy==2.4.6",
  "pandas==3.1.1",
  "pyarrow==26.0.1",
  "pillow==13.0.0",
  "pyyaml==6.0.3",
  "tqdm==4.70.1",
  "requests==2.34.2",
  "fastapi==0.163.1",
  "uvicorn[standard]==0.54.0",
  "python-multipart==0.0.33",
  "anthropic==2.8.0",
  "httpx==0.28.1",
  "pydantic==2.14.3",
  "c2pa-python==0.39.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0"]

[tool.setuptools.packages.find]
include = ["ml*", "api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
